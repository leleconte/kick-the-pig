<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KICK THE PIG | Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;900&family=Orbitron:wght@700&display=swap');
        
        :root { --accent: #ff003c; }
        body { background-color: #050505; color: white; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; }
        
        /* --- ESTETICA HOME --- */
        .font-huge { font-family: 'Archivo Black', sans-serif; line-height: 0.8; letter-spacing: -0.05em; }
        .glitch { font-size: clamp(4rem, 12vw, 10rem); position: relative; text-transform: uppercase; }
        .glitch::before, .glitch::after { content: "KICK THE PIG"; position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.8; }
        .glitch::before { color: #0ff; z-index: -1; animation: glitch-anim 0.3s infinite; }
        .glitch::after { color: var(--accent); z-index: -2; animation: glitch-anim 0.3s infinite reverse; }
        @keyframes glitch-anim {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, 2px); }
            40% { transform: translate(-3px, -2px); }
            60% { transform: translate(3px, 2px); }
            100% { transform: translate(0); }
        }

        .play-btn { background: white; color: black; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%); transition: all 0.3s ease; }
        .play-btn:hover { background: var(--accent); color: white; transform: scale(1.1) rotate(-1deg); }

        /* --- UI GIOCO --- */
        .weapon-card { transition: all 0.2s; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); position: relative; overflow: hidden; }
        .locked { filter: grayscale(1) opacity(0.5); cursor: not-allowed; }
        .weapon-card:hover:not(.locked) { border-color: var(--accent); background: rgba(255,0,60,0.2); }
        .active-weapon { border-color: var(--accent) !important; background: rgba(255,0,60,0.4) !important; }
        canvas { cursor: crosshair; touch-action: none; }
        .hud-font { font-family: 'Orbitron', sans-serif; }

        #shop-menu { background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    </style>
</head>
<body>

    <div class="fixed inset-0 pointer-events-none opacity-[0.03] z-[100]" style="background-image: url('https://grainy-gradients.vercel.app/noise.svg');"></div>

    <section id="home-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black text-center p-6">
        <div class="absolute top-10 left-10 text-left opacity-30 font-mono text-[10px] tracking-widest uppercase">
            Status: Engine_Ready<br>Target: Pig_Unit<br>V. 2.0.26
        </div>

        <div class="glitch-wrapper mb-8">
            <h1 class="glitch font-huge">KICK THE<br><span class="text-red-600">PIG</span></h1>
        </div>

        <p class="uppercase tracking-[0.6em] text-[10px] mb-12 opacity-50 font-bold italic">High Efficiency Destruction System</p>

        <button onclick="startGame()" class="play-btn px-16 py-6 text-2xl font-black uppercase italic">
            Inizia Tortura
        </button>
    </section>

    <div id="game-ui" class="hidden fixed inset-0 z-10 pointer-events-none">
        <div class="absolute top-8 left-8 hud-font pointer-events-auto">
            <p class="text-red-600 text-[10px] tracking-tighter uppercase mb-1">Budget Guadagnato</p>
            <h2 id="score" class="text-5xl font-black italic text-white">€ 0</h2>
        </div>

        <div class="absolute bottom-8 right-8 flex gap-4 pointer-events-auto">
            <button onclick="toggleShop()" class="bg-white text-black font-black px-8 py-3 uppercase tracking-widest hover:bg-red-600 hover:text-white transition-colors">SHOP</button>
        </div>

        <div id="shop-menu" class="absolute right-0 top-0 h-full w-80 translate-x-full p-8 pointer-events-auto border-l border-white/10">
            <h3 class="font-black text-2xl uppercase mb-8 italic border-b border-red-600 pb-2">Armory</h3>
            <div id="weapon-list" class="flex flex-col gap-4">
                <div id="w-punch" onclick="buyOrSelect('punch', 0)" class="weapon-card active-weapon p-4 rounded-xl flex items-center justify-between">
                    <div><span class="text-2xl">👊</span> <span class="text-xs font-bold ml-2">PUNCH</span></div>
                    <span class="text-[10px] opacity-50 uppercase">Owned</span>
                </div>
                <div id="w-knife" onclick="buyOrSelect('knife', 500)" class="weapon-card locked p-4 rounded-xl flex items-center justify-between">
                    <div><span class="text-2xl">🔪</span> <span class="text-xs font-bold ml-2">KNIFE</span></div>
                    <span class="text-[10px] font-bold text-red-500">€ 500</span>
                </div>
                <div id="w-ak47" onclick="buyOrSelect('ak47', 2500)" class="weapon-card locked p-4 rounded-xl flex items-center justify-between">
                    <div><span class="text-2xl">🔫</span> <span class="text-xs font-bold ml-2">AK-47</span></div>
                    <span class="text-[10px] font-bold text-red-500">€ 2500</span>
                </div>
                <div id="w-bomb" onclick="buyOrSelect('bomb', 10000)" class="weapon-card locked p-4 rounded-xl flex items-center justify-between">
                    <div><span class="text-2xl">💣</span> <span class="text-xs font-bold ml-2">BOMB</span></div>
                    <span class="text-[10px] font-bold text-red-500">€ 10k</span>
                </div>
            </div>
            <button onclick="toggleShop()" class="mt-8 text-[10px] uppercase opacity-50">Chiudi Shop</button>
        </div>

        <button onclick="location.reload()" class="absolute bottom-8 left-8 text-[10px] opacity-30 hover:opacity-100 uppercase font-bold tracking-widest pointer-events-auto">Spegni Sistema</button>
    </div>

    <canvas id="game-canvas" class="block"></canvas>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let score = 0;
        let currentWeapon = 'punch';
        let gameActive = false;
        let isDragging = false;
        let shopOpen = false;

        const weapons = {
            punch: { power: 15, gain: 10, owned: true },
            knife: { power: 8, gain: 30, owned: false, price: 500 },
            ak47: { power: 5, gain: 60, owned: false, price: 2500 },
            bomb: { power: 60, gain: 500, owned: false, price: 10000 }
        };

        let buddy = {
            x: 0, y: 0,
            vx: 0, vy: 0,
            rotation: 0, rv: 0,
            r: 50
        };

        function startGame() {
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('game-ui').classList.remove('hidden');
            resize();
            buddy.x = canvas.width / 2;
            buddy.y = canvas.height / 2;
            gameActive = true;
            animate();
        }

        function toggleShop() {
            shopOpen = !shopOpen;
            document.getElementById('shop-menu').style.transform = shopOpen ? 'translateX(0)' : 'translateX(100%)';
        }

        function buyOrSelect(id, price) {
            if (weapons[id].owned) {
                currentWeapon = id;
                document.querySelectorAll('.weapon-card').forEach(c => c.classList.remove('active-weapon'));
                document.getElementById('w-' + id).classList.add('active-weapon');
            } else if (score >= price) {
                score -= price;
                weapons[id].owned = true;
                document.getElementById('score').innerText = `€ ${score}`;
                document.getElementById('w-' + id).classList.remove('locked');
                document.getElementById('w-' + id).querySelector('span:last-child').innerText = "Owned";
                buyOrSelect(id, 0);
            }
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function drawBuddy() {
            ctx.save();
            ctx.translate(buddy.x, buddy.y);
            ctx.rotate(buddy.rotation);

            // Tunica
            ctx.fillStyle = "white";
            ctx.shadowBlur = 15; ctx.shadowColor = "rgba(255,255,255,0.1)";
            ctx.fillRect(-25, -40, 50, 80);

            // Testa
            ctx.beginPath();
            ctx.arc(0, -65, 25, 0, Math.PI * 2);
            ctx.fillStyle = "#ffdbac";
            ctx.fill();

            // CANNA IN BOCCA
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(5, -55);
            ctx.lineTo(20, -52);
            ctx.stroke();
            // Brace
            ctx.fillStyle = "#ff4500";
            ctx.shadowBlur = 10; ctx.shadowColor = "#ff4500";
            ctx.beginPath();
            ctx.arc(22, -52, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Capelli e Barba
            ctx.fillStyle = "#4b2c20";
            ctx.fillRect(-28, -75, 56, 12);
            ctx.fillRect(-12, -50, 24, 18);

            // Aureola
            ctx.strokeStyle = "#ffd700";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(0, -100, 22, 6, 0, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        }

        function update() {
            if (!gameActive || isDragging) return;

            buddy.vy += 0.6; // Gravità
            buddy.x += buddy.vx;
            buddy.y += buddy.vy;
            buddy.rotation += buddy.rv;

            buddy.vx *= 0.98;
            buddy.vy *= 0.98;
            buddy.rv *= 0.97;

            if (buddy.y > canvas.height - 80) {
                buddy.y = canvas.height - 80;
                buddy.vy *= -0.4;
            }
            if (buddy.x < 50 || buddy.x > canvas.width - 50) {
                buddy.vx *= -0.6;
                buddy.x = buddy.x < 50 ? 50 : canvas.width - 50;
            }
        }

        function animate() {
            // SFONDO MIGLIORATO
            let grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, canvas.width);
            grad.addColorStop(0, "#1a1a1a");
            grad.addColorStop(1, "#0a0a0a");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Griglia Tecnica
            ctx.strokeStyle = "rgba(255,0,0,0.05)";
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=80) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let i=0; i<canvas.height; i+=80) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            update();
            drawBuddy();
            requestAnimationFrame(animate);
        }

        // INPUT GESTITI PER DRAG E HIT
        canvas.addEventListener('mousedown', (e) => {
            const dist = Math.hypot(e.clientX - buddy.x, e.clientY - buddy.y);
            if (dist < 80) {
                isDragging = true;
                buddy.vx = 0; buddy.vy = 0; buddy.rv = 0;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                buddy.x = e.clientX;
                buddy.y = e.clientY;
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (isDragging) {
                isDragging = false;
                buddy.vx = (e.movementX || 0) * 2;
                buddy.vy = (e.movementY || 0) * 2;
            } else {
                const dist = Math.hypot(e.clientX - buddy.x, e.clientY - buddy.y);
                if (dist < 100) {
                    let w = weapons[currentWeapon];
                    score += w.gain;
                    document.getElementById('score').innerText = `€ ${score}`;
                    const angle = Math.atan2(buddy.y - e.clientY, buddy.x - e.clientX);
                    buddy.vx += Math.cos(angle) * w.power;
                    buddy.vy += Math.sin(angle) * w.power;
                    buddy.rv = (Math.random() - 0.5) * 0.4;
                }
            }
        });

        window.addEventListener('resize', resize);
    </script>
</body>
</html>
